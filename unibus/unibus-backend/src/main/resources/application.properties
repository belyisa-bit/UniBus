spring.application.name=unibus-backend

# Força o nome do banco para não gerar hash aleatório
spring.datasource.url=jdbc:h2:mem:unibusdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita explicitamente o console Web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execução do script data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true