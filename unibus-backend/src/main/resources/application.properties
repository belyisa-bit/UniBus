spring.application.name=unibus-backend
server.port=${PORT:8081}

# Origens do frontend permitidas no CORS; em deploy, configure a URL pública.
unibus.cors.allowed-origins=${UNIBUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,http://localhost:8100,http://localhost:4200,http://localhost:8080}

# Configuracao do Banco de Dados H2 em Memoria
spring.datasource.url=jdbc:h2:mem:unibusdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracao JWT
security.jwt.secret=${UNIBUS_JWT_SECRET}
security.jwt.expiration-ms=86400000

logging.level.org.springframework.security=TRACE
