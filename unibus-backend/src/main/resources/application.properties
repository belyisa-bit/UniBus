spring.application.name=unibus-backend
server.port=${PORT:8081}

# Origens permitidas; sobrescreva no deploy com a URL pública do frontend.
unibus.cors.allowed-origins=${UNIBUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,https://unibus-frontend-five.vercel.app,https://s-frontend-five.vercel.app}

# Perfil padrão para desenvolvimento local; no Render, use SPRING_PROFILES_ACTIVE=render.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
