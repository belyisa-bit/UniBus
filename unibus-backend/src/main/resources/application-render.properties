# Banco PostgreSQL do Render
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configure JWT_SECRET (ou UNIBUS_JWT_SECRET) no Render com chave Base64 de 32+ bytes.
security.jwt.secret=${JWT_SECRET:${UNIBUS_JWT_SECRET}}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
