# Banco H2 para desenvolvimento local
spring.datasource.url=jdbc:h2:mem:unibusdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave apenas para desenvolvimento local; pode ser sobrescrita por ambiente.
security.jwt.secret=${UNIBUS_JWT_SECRET:dW5pYnVzLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0zMg==}
